<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация Wiki</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('Wiki.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a1a2e;
            background-blend-mode: overlay;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            color: blueviolet;
            background: linear-gradient(135deg, blanchedalmond, #ffe4c4);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            margin-top: 0;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(138, 43, 226, 0.2); }
            to { box-shadow: 0 0 30px rgba(138, 43, 226, 0.5); }
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        a {
            display: block;
            color: chocolate;
            font-style: italic;
            font-size: 18px;
            text-decoration: none;
            padding: 14px 20px;
            background: rgba(210, 180, 140, 0.10);
            border-radius: 16px;
            border: 1px solid rgba(210, 180, 140, 0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(210, 105, 30, 0.15), transparent);
            transition: left 0.5s ease;
        }

        a:hover::before {
            left: 100%;
        }

        a:hover {
            background: rgba(210, 180, 140, 0.20);
            transform: translateX(12px) scale(1.02);
            border-color: chocolate;
            box-shadow: 0 8px 30px rgba(210, 105, 30, 0.25);
        }

        a:active {
            transform: scale(0.95);
        }

        a small {
            display: block;
            font-style: normal;
            font-size: 13px;
            color: #888;
            margin-top: 4px;
            font-weight: 300;
        }

        .emoji-bounce {
            display: inline-block;
            animation: bounce 1.5s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @media (max-width: 500px) {
            .card {
                padding: 24px 18px;
            }
            h2 {
                font-size: 22px;
                padding: 6px 18px;
            }
            a {
                font-size: 16px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2><span class="emoji-bounce">📖</span> Навигация wiki</h2>
        <div class="link-list">
            <a href="https://ks993416.github.io/wiki/шифроватор">
                <span class="emoji-bounce">шифр</span> Шифроватор
                <small>статью закрыли, но можно почитать</small>
            </a>
            <a href="https://ks993416.github.io/wiki/new">
                <span class="emoji-bounce">оценочки</span> Отцениваю свои проекты
                <small>моя самооценка</small>
            </a>
        </div>
    </div>
</body>
</html>
